<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}">
<th:block layout:fragment="content">
  <div class="content_title">
    <h3 class="page_title">비상메시지</h3>
    <ol class="page_breadcrumb">
      <li>HOME</li>
      <li><a href="#">제어</a></li>
      <li><a href="#">비상메시지</a></li>
    </ol>
  </div>

  <div class="content_area">

    <div class="search_wrap">

      <ul>
        <li class="col_2cell">
          <p>메시지</p>
          <div class="rowbox">
            <input type="text" id="s_content_all" placeholder="비상메시지를 입력해주세요." />
          </div>
        </li>
        <li class="col_2cell">
          <p>글자색상</p>
          <div class="rowbox row-flex">
            <label class="hide"></label>
            <select  id="color"  class="select_box" required name="color">
              <option value="00" selected>색상을 선택하세요</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">

          <div class="rowbox">
            <label class="hide"></label>
            <div id="preview" class="mt-2 w-32 h-12 border rounded-md text-center flex items-center justify-center font-bold"></div>
          </div>
        </li>
      </ul>
      <div class="srch_btn">
        <div class="type_grp type_single">
          <button type="button" class="btn_def btn_point_clr" onclick="sendMessage(1)">전송</button>
          <button type="button" class="btn_def btn_line_black" onclick="sendMessage(0)">해제</button>
        </div>
      </div>
    </div>
    <div class="search_wrap" style="display: none">
      <ul>
        <li class="col_2cell">
          <p>시작 효과</p>
          <div class="rowbox">
            <label class="hide"></label>
            <select class="select_box" required name="eff" id="eff_start">
              <option value="0900" selected>효과 없음</option>
              <option value="0100">효과 자동</option>
              <option value="0200">애니메이션</option>
              <option value="0300">나타나기</option>
              <option value="0400">깜빡임</option>
              <option value="0500">글자별</option>
              <option value="0600">확대/축소</option>
              <option value="0700">색상별</option>
              <option value="0800">3D 효과</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">
          <p>대기 효과</p>
          <div class="rowbox">
            <label class="hide"></label>
            <select class="select_box" required name="eff" id="eff_wait">
              <option value="0900" selected>효과 없음</option>
              <option value="0100">효과 자동</option>
              <option value="0200">애니메이션</option>
              <option value="0300">나타나기</option>
              <option value="0400">깜빡임</option>
              <option value="0500">글자별</option>
              <option value="0600">확대/축소</option>
              <option value="0700">색상별</option>
              <option value="0800">3D 효과</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">
          <p>종료 효과</p>
          <div class="rowbox">
            <label class="hide"></label>
            <select class="select_box" required name="eff" id="eff_end">
              <option value="0900" selected>효과 없음</option>
              <option value="0100">효과 자동</option>
              <option value="0200">애니메이션</option>
              <option value="0300">나타나기</option>
              <option value="0400">깜빡임</option>
              <option value="0500">글자별</option>
              <option value="0600">확대/축소</option>
              <option value="0700">색상별</option>
              <option value="0800">3D 효과</option>
            </select>
          </div>
        </li>

        <li class="col_2cell">
          <p>글자체</p>
          <div class="rowbox row-flex">
            <label class="hide"></label>
            <select  id="font"  class="select_box" required>
              <option value="00"  selected>0</option>
              <option value="01"  >1</option>
              <option value="02"  >2</option>
              <option value="03"  >3</option>
              <option value="04"  >4</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">
          <p>글자크기</p>
          <div class="rowbox row-flex">
            <label class="hide"></label>
            <select  id="ysz"  class="select_box" required>
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">
          <p>장평</p>
          <div class="rowbox row-flex">
            <label class="hide"></label>
            <select  id="weight"  class="select_box" required name="color">
              <option value="01"selected>1</option>
              <option value="02">2</option>
              <option value="03">3</option>
              <option value="04">4</option>
            </select>
          </div>
        </li>
        <li class="col_2cell">
          <p>글자폭맞춤</p>
          <div class="rowbox row-flex">
            <label class="hide"></label>
            <select id="fix"  class="select_box" required name="color">
              <option value="1" selected>맞춤</option>
              <option value="0">없음</option>
            </select>
          </div>
        </li>
      </ul>
      <div class="srch_btn">
        <div class="type_grp type_single">
<!--          <button type="button" class="btn_def btn_point_clr" onclick="updateMsg(0)">저장</button>-->
          <button type="button" class="btn_def btn_line_black" onclick="sendMessage()">선택전송</button>
        </div>
      </div>

    </div>

<!--      그리드 구간-->
    <div class="grid_board" style="display: none">
      <div id="grid_tale"></div>
      <div id="grid_pagination" class="tui-pagination"></div>
    </div>

  </div>
  <script src="/webjars/sockjs-client/sockjs.min.js"></script>
  <script src="/webjars/stomp-websocket/stomp.min.js"></script>
  <script type="text/javascript" th:src="@{/js/message.js}"></script>
  <script>
    $(document).ready(function () {

    });

  </script>
</th:block>
</html>
