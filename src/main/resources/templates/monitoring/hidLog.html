<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}">
<th:block layout:fragment="content">

  <!-- 모달 스타일 -->
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      width: 60%;
      text-align: center;
      border-radius: 8px;
    }

    .modal-content img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .close-btn {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>

  <div class="content_title">
    <h3 class="page_title">HID</h3>
    <ol class="page_breadcrumb">
      <li>HOME</li>
      <li><a href="#">시스템 모니터링</a></li>
      <li><a href="#">HID</a></li>
    </ol>
  </div>

  <div class="content_area">

    <div class="search_wrap">
      <ul>
        <li>
          <p>정류장 ID</p>
          <div class="rowbox">
            <input type="text" id="s_terminalId" placeholder="정류장 ID 를 입력해주세요">
          </div>
        </li>
        <li>
          <p>정류장 명</p>
          <div class="rowbox">
            <input type="text" id="s_terminalNm" placeholder="정류장 명 을 입력해주세요">
          </div>
        </li>
      </ul>

      <div class="srch_btn">
        <div class="type_grp type_single">
          <button type="button" class="btn_def btn_point_clr" onclick="getHidList()">조회</button>
          <button type="button" class="btn_def btn_red_clr" onclick="clearContents()">초기화</button>
        </div>
      </div>
    </div>

    <div class="area_title">
      <h4 class="left_grp">
        <span class="sub_title">조회결과</span>
        <span class="sub_script">총 건수:
          <span class="num"></span>건
        </span>
      </h4>
    </div>

    <div class="grid_board">
      <div id="grid_tale"></div>
      <div id="grid_pagination" class="tui-pagination"></div>
    </div>
  </div>

  <div id="datepicker_wrapper" style="margin-top: -1px;"></div>

  <th:block th:replace="fragments/popup :: popup_image" />
  <script type="text/javascript" th:src="@{/js/hidLog.js}"></script>
</th:block>
</html>
