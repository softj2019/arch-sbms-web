<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접근 제한 - 스마트버스정류장 안전시스템</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .denied-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 480px;
      width: 90%;
      padding: 48px 40px;
      text-align: center;
    }
    .denied-icon {
      width: 80px;
      height: 80px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .denied-icon svg {
      width: 40px;
      height: 40px;
      color: #dc2626;
    }
    .denied-title {
      font-size: 22px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 12px;
    }
    .denied-desc {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .ip-box {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 28px;
    }
    .ip-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .ip-value {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 1px;
    }
    .contact-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .contact-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e40af;
      margin-bottom: 8px;
    }
    .contact-item {
      font-size: 13px;
      color: #374151;
      line-height: 1.8;
    }
    .btn-back {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-back:hover { background: #4338ca; }
    .footer-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="denied-container">
    <div class="denied-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
      </svg>
    </div>

    <h1 class="denied-title">접근이 제한되었습니다</h1>
    <p class="denied-desc">
      현재 접속하신 IP 주소는 허용 목록에 등록되어 있지 않습니다.<br>
      시스템 관리자에게 아래 IP 주소를 전달하여 접근을 요청해 주세요.
    </p>

    <div class="ip-box">
      <div class="ip-label">접속 IP 주소</div>
      <div class="ip-value" id="clientIp">-</div>
    </div>

    <div class="contact-box">
      <div class="contact-title">관리자 문의 안내</div>
      <div class="contact-item">
        1. 위 IP 주소를 관리자에게 전달해 주세요.<br>
        2. 관리자가 허용 IP를 등록한 후 접속이 가능합니다.<br>
        3. VPN 또는 네트워크 변경 시 IP가 달라질 수 있습니다.
      </div>
    </div>

    <a href="/login" class="btn-back">로그인 페이지로 돌아가기</a>

    <p class="footer-text">&copy; 2024 군포시 스마트버스정류장 안전시스템</p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var ip = params.get('ip');
      if (ip) {
        document.getElementById('clientIp').textContent = ip;
      } else {
        document.getElementById('clientIp').textContent = '확인 불가';
      }
    })();
  </script>
</body>
</html>
