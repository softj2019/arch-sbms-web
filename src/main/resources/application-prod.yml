logging:
  file:
    name: logs/application.log
    path: ${user.dir}
  config: classpath:logback-spring.xml
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{5} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.archivsoft: INFO
    org.springframework: INFO
    org.mybatis: INFO
    org.apache.ibatis: INFO
    jdbc.audit: OFF
    jdbc.connection: OFF
    jdbc.resultset: OFF
    jdbc.resultsettable: OFF
    jdbc.sqlonly: INFO
    jdbc.sqltiming: INFO

spring:
  websocket:
    max-text-message-size: 50MB
    max-binary-message-size: 50MB
    task-execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.10.10.11:3306/sbms?allowPublicKeyRetrieval=true&useSSL=false
    username: sbms
    password: Gunpo1212!Q
  main:
    banner-mode: 'off'
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDB103Dialect
  pid:
    file: .pid
  security:
    user:
      algorithm: rms
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  spring:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
    cache:
      cache:
        type: simple

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/*.xml

rms:
  default:
    main: /my
app:
  jwt:
    secret_key: mySecretKey12345678901234567890123456789012
server:
  port: 8080
  compression:
    enabled: true
  servlet:
    session:
      timeout: 86400
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
upload:
  path: /data/storage/uploads/