plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.12'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'idea'
    id 'war'
}

group 'com.archivsoft'
version '1.0'

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.egovframe.rte', module: 'org.egovframe.rte.fdl.logging'
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'org.egovframe.rte', module: 'spring-modules-validation'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url 'https://nexus.archivsoft.com/repository/maven-public/'
        allowInsecureProtocol true
        credentials {
            username = 'archivsoft'
            password = 'archivsoft!@'
        }
    }
}

ext {
    junitVersion = '5.8.2'
    spring_maven_artifact_version = '3.2.9.RELEASE'
    egovframework_rte_version = '4.2.0'
    spring_security_version = '3.2.3.RELEASE'
    jdk_version = '1.6'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

bootRun {
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

dependencies {

    /* -----------------------------------------------
     * Spring Boot 기본 모듈
     * ----------------------------------------------- */
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    /* -----------------------------------------------
     * Thymeleaf / Layout / Security
     * ----------------------------------------------- */
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    /* -----------------------------------------------
     * Validation (Jakarta)
     * ----------------------------------------------- */
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    /* -----------------------------------------------
     * MyBatis
     * ----------------------------------------------- */
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2'

    /* -----------------------------------------------
     * DB Driver (Oracle / MariaDB / MySQL)
     * ----------------------------------------------- */
    implementation 'com.oracle.database.jdbc:ojdbc6:11.2.0.4'
    implementation 'com.oracle.database.nls:orai18n:11.2.0.4'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.3.0'
    implementation 'mysql:mysql-connector-java:8.0.28'

    /* -----------------------------------------------
     * eGovFrame
     * ----------------------------------------------- */
    implementation "org.egovframe.rte:org.egovframe.rte.psl.dataaccess:${egovframework_rte_version}"
    implementation "org.egovframe.rte:org.egovframe.rte.fdl.cmmn:${egovframework_rte_version}"
    implementation "org.egovframe.rte:org.egovframe.rte.ptl.mvc:${egovframework_rte_version}"

    /* -----------------------------------------------
     * JSON / YAML
     * ----------------------------------------------- */
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.13.5'
    implementation 'com.google.code.gson:gson'

    /* -----------------------------------------------
     * OpenAPI / Swagger
     * ----------------------------------------------- */
    implementation 'org.springdoc:springdoc-openapi-ui:1.6.14'

    /* -----------------------------------------------
     * WebJars (Front-end)
     * ----------------------------------------------- */
    implementation 'org.webjars.bower:jquery:3.7.1'
    implementation 'org.webjars.npm:chart.js:3.7.0'
    implementation 'org.webjars.npm:echarts:5.4.3'
    implementation 'org.webjars:sockjs-client:1.5.1'
    implementation 'org.webjars:stomp-websocket:2.3.4'
    implementation 'org.webjars:font-awesome:6.4.2'
    implementation 'org.webjars.npm:chartjs-plugin-datalabels:2.2.0'

    /* -----------------------------------------------
     * JWT
     * ----------------------------------------------- */
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /* -----------------------------------------------
     * Undertow
     * ----------------------------------------------- */
    implementation 'io.undertow:undertow-servlet'

    /* -----------------------------------------------
     * 기타 공통 유틸
     * ----------------------------------------------- */
    implementation 'p6spy:p6spy:3.9.1'
    implementation fileTree(dir: 'lib', includes: ['*.jar'])

    /* -----------------------------------------------
     * Lombok / Devtools
     * ----------------------------------------------- */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    /* -----------------------------------------------
     * Test
     * ----------------------------------------------- */
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
