# =============================================================
# 운영서버(Spring Boot) Active-Standby 무중단 배포
#
# 브랜치 전략:
#   dev push  → app01 + app02 양쪽 테스트 배포 (자동)
#   prod push → Active-Standby 무중단 운영 배포 (Standby 자동 → Active 수동승인)
#   수동 dispatch → 전체 제어
# =============================================================

name: Server Deploy

on:
  push:
    branches: [dev, prod]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'mcu-pi/**'
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 작업'
        required: true
        type: choice
        options:
          - deploy-standby
          - deploy-active
          - deploy-both
          - switch
          - rollback-standby
          - rollback-active
          - status
      target_branch:
        description: '배포 브랜치'
        required: false
        default: 'dev'

env:
  SERVER_SSH_PASS: ${{ secrets.SERVER_SSH_PASS }}
  DEPLOY_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────
  # dev push → 양쪽 서버 테스트 배포
  # ─────────────────────────────────────────────
  test-deploy-all:
    name: "Test Deploy (app01 + app02)"
    runs-on: [self-hosted, linux, sbms]
    if: github.event_name == 'push' && github.ref_name == 'dev'
    strategy:
      fail-fast: false
      matrix:
        server: [app01, app02]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: "Deploy to ${{ matrix.server }}"
        run: |
          python3 << 'PYEOF'
          import paramiko, json, sys, os, time
          from pathlib import Path

          inv = json.loads(Path("ops/inventory/server-inventory.json").read_text())
          branch = os.environ.get("DEPLOY_BRANCH", "dev")
          password = os.environ.get("SERVER_SSH_PASS", "")
          target_id = "${{ matrix.server }}"

          server = next(s for s in inv if s["id"] == target_id)
          print(f"=== Deploy {server['id']} ({server['host']}) branch={branch} ===")

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(server["host"], port=server["port"],
                         username=server["user"], password=password, timeout=15)

          def run(cmd, timeout=600):
              stdin, stdout, stderr = client.exec_command(cmd, timeout=timeout)
              out = stdout.read().decode('utf-8', errors='replace').strip()
              err = stderr.read().decode('utf-8', errors='replace').strip()
              code = stdout.channel.recv_exit_status()
              if out: print(out)
              if code != 0 and err: print(f"STDERR: {err}", file=sys.stderr)
              return out, code

          ts = time.strftime("%Y%m%d-%H%M%S")
          src = server["srcDir"]
          rel_root = server["releaseRoot"]
          app_dir = server["appDir"]
          svc = server["serviceName"]
          svc_port = server["servicePort"]
          release_dir = f"{rel_root}/{branch}-{ts}"

          # 1. Git pull
          print(f"\n[1/5] git pull ({branch})")
          run(f"cd {src} && git fetch origin && git checkout {branch} 2>/dev/null; git checkout -b {branch} origin/{branch} 2>/dev/null; git reset --hard origin/{branch} 2>&1 | tail -3")
          run(f"cd {src} && git log --oneline -1")

          # 2. Build
          print(f"\n[2/5] Gradle build")
          _, code = run(f"cd {src} && ./gradlew bootJar 2>&1 | tail -15")
          if code != 0:
              print("::error::Build failed")
              sys.exit(1)

          # 3. Release
          print(f"\n[3/5] Release -> {release_dir}")
          run(f"mkdir -p {release_dir}/logs && cp {src}/build/libs/*.jar {release_dir}/app.jar && ln -sfn {release_dir} {app_dir}")
          run(f"ls -lh {app_dir}/app.jar")

          # 4. Restart
          print(f"\n[4/5] Restart {svc}")
          run(f"sudo systemctl restart {svc}", timeout=30)

          # 5. Health check
          print(f"\n[5/5] Health check")
          ok = False
          for i in range(30):
              time.sleep(1)
              out, _ = run(f"curl -s -o /dev/null -w '%{{http_code}}' http://localhost:{svc_port}/login 2>/dev/null || echo 000")
              if out.strip() in ("200", "302"):
                  print(f"HTTP {out.strip()} OK ({i+1}s)")
                  ok = True
                  break
          if not ok:
              print("::error::Health check failed")
              run(f"sudo systemctl status {svc} --no-pager -l 2>&1 | tail -20")
              sys.exit(1)

          client.close()
          print(f"\n=== {server['id']} deploy SUCCESS ===")
          PYEOF

  # ─────────────────────────────────────────────
  # prod push → Standby 자동 배포
  # ─────────────────────────────────────────────
  prod-deploy-standby:
    name: "Prod: Deploy Standby"
    runs-on: [self-hosted, linux, sbms]
    if: github.event_name == 'push' && github.ref_name == 'prod'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Deploy to Standby
        run: |
          python3 << 'PYEOF'
          import paramiko, json, sys, os, time
          from pathlib import Path

          inv = json.loads(Path("ops/inventory/server-inventory.json").read_text())
          branch = "prod"
          password = os.environ.get("SERVER_SSH_PASS", "")
          standby = next(s for s in inv if s["role"] == "standby")

          print(f"=== PROD Deploy Standby: {standby['id']} ({standby['host']}) ===")

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(standby["host"], port=standby["port"],
                         username=standby["user"], password=password, timeout=15)

          def run(cmd, timeout=600):
              stdin, stdout, stderr = client.exec_command(cmd, timeout=timeout)
              out = stdout.read().decode('utf-8', errors='replace').strip()
              err = stderr.read().decode('utf-8', errors='replace').strip()
              code = stdout.channel.recv_exit_status()
              if out: print(out)
              if code != 0 and err: print(f"STDERR: {err}", file=sys.stderr)
              return out, code

          ts = time.strftime("%Y%m%d-%H%M%S")
          src = standby["srcDir"]
          release_dir = f"{standby['releaseRoot']}/{branch}-{ts}"
          app_dir = standby["appDir"]
          svc = standby["serviceName"]
          svc_port = standby["servicePort"]

          run(f"cd {src} && git fetch origin && git checkout {branch} 2>/dev/null; git checkout -b {branch} origin/{branch} 2>/dev/null; git reset --hard origin/{branch} 2>&1 | tail -3")
          run(f"cd {src} && git log --oneline -1")
          _, code = run(f"cd {src} && ./gradlew bootJar 2>&1 | tail -15")
          if code != 0: sys.exit(1)

          run(f"mkdir -p {release_dir}/logs && cp {src}/build/libs/*.jar {release_dir}/app.jar && ln -sfn {release_dir} {app_dir}")
          run(f"sudo systemctl restart {svc}", timeout=30)

          ok = False
          for i in range(30):
              time.sleep(1)
              out, _ = run(f"curl -s -o /dev/null -w '%{{http_code}}' http://localhost:{svc_port}/login 2>/dev/null || echo 000")
              if out.strip() in ("200", "302"):
                  print(f"HTTP {out.strip()} OK ({i+1}s)")
                  ok = True
                  break
          if not ok:
              print("::error::Standby health check failed")
              sys.exit(1)

          client.close()
          print(f"=== Standby deploy SUCCESS ===")
          PYEOF

  # ─────────────────────────────────────────────
  # prod push → Active 배포 (수동 승인)
  # ─────────────────────────────────────────────
  prod-deploy-active:
    name: "Prod: Deploy Active (approval required)"
    runs-on: [self-hosted, linux, sbms]
    needs: prod-deploy-standby
    if: github.event_name == 'push' && github.ref_name == 'prod'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Deploy to Active
        run: |
          python3 << 'PYEOF'
          import paramiko, json, sys, os, time
          from pathlib import Path

          inv = json.loads(Path("ops/inventory/server-inventory.json").read_text())
          branch = "prod"
          password = os.environ.get("SERVER_SSH_PASS", "")
          active = next(s for s in inv if s["role"] == "active")

          print(f"=== PROD Deploy Active: {active['id']} ({active['host']}) ===")

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect(active["host"], port=active["port"],
                         username=active["user"], password=password, timeout=15)

          def run(cmd, timeout=600):
              stdin, stdout, stderr = client.exec_command(cmd, timeout=timeout)
              out = stdout.read().decode('utf-8', errors='replace').strip()
              code = stdout.channel.recv_exit_status()
              if out: print(out)
              return out, code

          ts = time.strftime("%Y%m%d-%H%M%S")
          src = active["srcDir"]
          release_dir = f"{active['releaseRoot']}/{branch}-{ts}"
          app_dir = active["appDir"]
          svc = active["serviceName"]
          svc_port = active["servicePort"]

          run(f"cd {src} && git fetch origin && git checkout {branch} 2>/dev/null; git checkout -b {branch} origin/{branch} 2>/dev/null; git reset --hard origin/{branch} 2>&1 | tail -3")
          run(f"cd {src} && git log --oneline -1")
          _, code = run(f"cd {src} && ./gradlew bootJar 2>&1 | tail -15")
          if code != 0: sys.exit(1)

          run(f"mkdir -p {release_dir}/logs && cp {src}/build/libs/*.jar {release_dir}/app.jar && ln -sfn {release_dir} {app_dir}")
          run(f"sudo systemctl restart {svc}", timeout=30)

          ok = False
          for i in range(30):
              time.sleep(1)
              out, _ = run(f"curl -s -o /dev/null -w '%{{http_code}}' http://localhost:{svc_port}/login 2>/dev/null || echo 000")
              if out.strip() in ("200", "302"):
                  print(f"HTTP {out.strip()} OK ({i+1}s)")
                  ok = True
                  break
          if not ok:
              print("::error::Active health check failed")
              sys.exit(1)

          client.close()
          print(f"=== Active deploy SUCCESS ===")
          PYEOF

  # ─────────────────────────────────────────────
  # 수동: 개별 서버 배포 / 전환 / 롤백 / 상태
  # ─────────────────────────────────────────────
  manual-deploy:
    name: "Manual: ${{ github.event.inputs.action }}"
    runs-on: [self-hosted, linux, sbms]
    if: >
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["deploy-standby","deploy-active","deploy-both"]'), github.event.inputs.action)
    environment: ${{ github.event.inputs.action == 'deploy-active' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Execute
        run: bash ops/server-deploy.sh ${{ github.event.inputs.action }}

  manual-switch:
    name: "Manual: Switch Roles"
    runs-on: [self-hosted, linux, sbms]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'switch'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Switch roles
        run: |
          python3 -c "
          import json; from pathlib import Path
          p = Path('ops/inventory/server-inventory.json')
          inv = json.loads(p.read_text())
          for s in inv:
              s['role'] = 'standby' if s['role'] == 'active' else 'active'
          p.write_text(json.dumps(inv, indent=2, ensure_ascii=False))
          for s in inv: print(f\"{s['id']}: {s['role']}\")
          "
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ops/inventory/server-inventory.json
          git diff --cached --quiet || git commit -m "ops: switch active/standby roles"
          git push

  manual-rollback:
    name: "Manual: Rollback"
    runs-on: [self-hosted, linux, sbms]
    if: >
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["rollback-standby","rollback-active"]'), github.event.inputs.action)
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Rollback
        run: |
          ROLE=$([[ "${{ github.event.inputs.action }}" == "rollback-standby" ]] && echo standby || echo active)
          TARGET_ID=$(python3 -c "
          import json; from pathlib import Path
          inv = json.loads(Path('ops/inventory/server-inventory.json').read_text())
          print(next(s['id'] for s in inv if s['role'] == '${ROLE}'))
          ")
          bash ops/server-deploy.sh rollback "$TARGET_ID"

  manual-status:
    name: "Manual: Status"
    runs-on: [self-hosted, linux, sbms]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'status'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip3 install paramiko 2>/dev/null || true
      - name: Check status
        run: bash ops/server-deploy.sh status
