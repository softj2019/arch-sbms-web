stages:
  - validate
  - package
  - deploy
  - verify
  - rollback

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - when: never

default:
  tags:
    - linux
    - shell
  before_script:
    - bash ops/common/ci_env.sh

variables:
  PACKAGE_DIR: "dist"
  PACKAGE_NAME: "sbms-pi"
  RELEASE_CHANNEL: "prod"
  INVENTORY_FILE: "ops/inventory/prod-terminals.json"

validate:python:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - bash ops/validate.sh

package:prod:
  stage: package
  needs:
    - validate:python
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
  script:
    - bash ops/package_release.sh
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

deploy:single:
  stage: deploy
  needs:
    - package:prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/single
  script:
    - test -n "$TARGET_TERMINAL_ID"
    - bash ops/deploy.sh single "$TARGET_TERMINAL_ID"

deploy:group-a:
  stage: deploy
  needs:
    - package:prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/group-a
  script:
    - bash ops/deploy.sh group prod-a

deploy:group-b:
  stage: deploy
  needs:
    - package:prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/group-b
  script:
    - bash ops/deploy.sh group prod-b

deploy:all:
  stage: deploy
  needs:
    - package:prod
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/all
  script:
    - bash ops/deploy.sh all

verify:single:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/single
  script:
    - test -n "$TARGET_TERMINAL_ID"
    - bash ops/verify_device.sh single "$TARGET_TERMINAL_ID"

verify:group-a:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/group-a
  script:
    - bash ops/verify_device.sh group prod-a

verify:all:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/all
  script:
    - bash ops/verify_device.sh all

rollback:single:
  stage: rollback
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/single
  script:
    - test -n "$TARGET_TERMINAL_ID"
    - bash ops/rollback.sh single "$TARGET_TERMINAL_ID"

rollback:group-a:
  stage: rollback
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
  environment:
    name: production/group-a
  script:
    - bash ops/rollback.sh group prod-a
